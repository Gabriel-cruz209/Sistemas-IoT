<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Controle LEDs</title>
</head>
<body>
    <header>
        <h1>Controle de LEDs com Arduino via Web</h1>
        <div class="forma">
            <h2>LED 1 (Verde)</h2>
            <button onclick="ligarVerde()">Ligar</button>
            <button onclick="desligarVerde()">Desligar</button>
        </div>
        <div class="forma">
            <h2>LED 2 (Vermelho)</h2>
            <button onclick="ligarVermelho()">Ligar</button>
            <button onclick="desligarVermelho()">Desligar</button>
        </div>
    </header>
</body>
</html>
